[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicleos"
version = "1.0.0"
description = "Autonomous Two-Brain Screenshot Vault and Semantic Search Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ShreyData", email = "shrey369h@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving",
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.48.0",
    "pillow>=10.2.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "watchfiles>=1.0.0",
    "numpy>=1.26.0",
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/ShreyData/ChronicleOS"
Repository = "https://github.com/ShreyData/ChronicleOS.git"
Issues = "https://github.com/ShreyData/ChronicleOS/issues"
